name: CI BuJo Library

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérification du respect de PEP 8
        run: |
          flake8 src tests run_bujo.py --count --show-source --statistics

      - name: Vérification de la présence des docstrings
        run: |
          pydocstyle --select=D100,D101,D102,D103 src/bujo

      - name: Exécution des tests unitaires avec pytest
        run: |
          pytest -v --junitxml=test-results-${{ matrix.python-version }}.xml

